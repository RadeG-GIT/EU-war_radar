<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>European Risk Radar</title>
<style>
  :root{
    --bg:#0E1417; --panel:#161D21; --panel-border:#232C31;
    --text:#DCE3E6; --text-dim:#8A979D; --sweep:#4E9A9E;
    --mono: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px;}
  header{margin-bottom:18px;}
  h1{font-size:1.35rem;font-weight:650;letter-spacing:0.01em;margin:0 0 4px;}
  .stamp{font-family:var(--mono);font-size:0.72rem;color:var(--text-dim);}
  .index-card{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:16px 18px;display:flex;align-items:center;gap:16px;margin-bottom:18px;}
  .index-number{font-family:var(--mono);font-size:2.4rem;font-weight:600;line-height:1;color:#C98A3B;}
  .index-copy{font-size:0.85rem;line-height:1.4;color:var(--text-dim);}

  /* --- Ceska republika - zvyrazneny panel --- */
  .czech-panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-left:4px solid #D7141A;
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:18px;
    display:none;
  }
  .czech-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .czech-flag{font-size:1.2rem;}
  .czech-title{font-weight:700;font-size:1rem;flex:1;}
  .czech-score-row{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;}
  .czech-score-num{font-family:var(--mono);font-size:2rem;font-weight:600;color:#C98A3B;}
  .czech-score-label{font-size:0.82rem;color:var(--text-dim);}
  .czech-headlines{margin:8px 0 0;padding-left:18px;font-size:0.8rem;line-height:1.6;color:var(--text-dim);}
  .czech-headlines a{color:var(--text-dim);}
  .czech-nonews{font-size:0.82rem;color:var(--text-dim);font-style:italic;margin-top:6px;}

  .radar-panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:12px;margin-bottom:8px;}
  svg{display:block;width:100%;height:auto;}
  .ring{fill:none;stroke:#25313586;stroke-width:1;}
  .crosshair{stroke:#25313586;stroke-width:1;}
  .ring-label{font-family:var(--mono);font-size:8px;fill:var(--text-dim);}
  .center-dot{fill:var(--sweep);}
  .center-label{font-family:var(--mono);font-size:9px;fill:var(--text);}
  .sweep-group{transform-origin:200px 200px;animation:spin 9s linear infinite;}
  .sweep-wedge{fill:url(#sweepGradient);}
  .sweep-line{stroke:var(--sweep);stroke-width:1.2;opacity:0.9;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){.sweep-group{animation:none;} .blip-pulse{animation:none !important;}}
  .blip{cursor:pointer;}
  .blip-pulse{animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:0.35;}50%{opacity:0.05;}}
  .blip-label{font-family:var(--mono);font-size:9px;fill:var(--text);}
  .radar-empty{font-family:var(--mono);font-size:0.72rem;fill:var(--text-dim);}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-family:var(--mono);font-size:0.68rem;color:var(--text-dim);padding:10px 6px 4px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .radar-note{font-size:0.68rem;color:var(--text-dim);padding:0 6px 6px;}
  .list{margin-top:18px;display:flex;flex-direction:column;gap:8px;}
  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;overflow:hidden;}
  .card.is-czech{border-color:#D7141A;}
  .card-head{padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .card-name{font-weight:600;font-size:0.92rem;flex:1;}
  .badge{font-family:var(--mono);font-size:0.64rem;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .trend{font-size:0.9rem;font-weight:700;width:16px;text-align:center;}
  .trend.up{color:#C1543F;}
  .trend.down{color:#4C8C6B;}
  .trend.same{color:var(--text-dim);}
  .trend.novy{color:var(--text-dim);}
  .chev{color:var(--text-dim);font-size:0.7rem;transition:transform 0.2s ease;}
  .card.open .chev{transform:rotate(90deg);}
  .card-body{max-height:0;overflow:hidden;transition:max-height 0.25s ease;}
  .card.open .card-body{border-top:1px solid var(--panel-border);}
  .card-body-inner{padding:12px 14px 14px;font-size:0.82rem;line-height:1.5;color:var(--text-dim);}
  .card-body-inner a{color:var(--text-dim);}
  .card-body-inner ul{margin:6px 0 0;padding-left:18px;}
  .no-news{font-style:italic;}
  footer{margin-top:22px;font-size:0.72rem;line-height:1.5;color:var(--text-dim);}
  footer p{margin:0 0 8px;}
  .error{color:#C1543F;font-family:var(--mono);font-size:0.8rem;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>European Risk Radar</h1>
    <div class="stamp" id="stamp">nacitani...</div>
  </header>

  <div class="index-card">
    <div class="index-number" id="indexNumber">--</div>
    <div class="index-copy" id="indexCopy">Nacitam aktualni data...</div>
  </div>

  <!-- Zvyrazneny panel pro Ceskou republiku - vzdy navrchu, bez ohledu na skore -->
  <div class="czech-panel" id="czechPanel">
    <div class="czech-head">
      <span class="czech-flag">🇨🇿</span>
      <span class="czech-title">Ceska republika</span>
      <span class="trend" id="czechTrend"></span>
      <span class="badge" id="czechBadge"></span>
    </div>
    <div class="czech-score-row">
      <span class="czech-score-num" id="czechScoreNum">--</span>
      <span class="czech-score-label">skore rizika / 100</span>
    </div>
    <div id="czechNewsWrap"></div>
  </div>

  <div class="radar-panel">
    <svg viewBox="0 0 400 360">
      <defs>
        <radialGradient id="sweepGradient" cx="0%" cy="0%" r="100%">
          <stop offset="0%" stop-color="#4E9A9E" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#4E9A9E" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g transform="translate(0,-20)">
        <circle class="ring" cx="200" cy="200" r="60"/>
        <circle class="ring" cx="200" cy="200" r="130"/>
